# The installer's console is a root shell, not a login prompt: whoever holds
# the stick already owns the machine — the wizard erases its disk without
# asking for a password — so a prompt no one has credentials for would only
# be a locked door on an open house. It's the shell that makes the console
# useful when the wizard needs help: lsblk, ip a, journalctl -u fog-setup.
# Live-only; the system this installs asks for a password like any Debian.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
