id: planner
title: Planner
description: A made-up first-party app for tests — a household's calendar, documents and todos.
category: Personal cloud
icon: '🗓️'
spec:
  source:
    type: git
    branch: main
    buildArgs:
      GIT_REV: '{{commit}}'
  env:
    GIT_REV: '{{commit}}'
    PLANNER_BASE_URL: https://{{fqdn}}
    SOLID_QUEUE_IN_PUMA: "1"
  secrets:
    - SECRET_KEY_BASE
    - AR_ENCRYPTION_PRIMARY_KEY
    - AR_ENCRYPTION_DETERMINISTIC_KEY
    - AR_ENCRYPTION_KEY_DERIVATION_SALT
  volumes:
    - name: storage
      mount: /rails/storage
      owner: 1000:1000
    - name: photo-cache
      mount: /rails/photo_cache
      owner: 1000:1000
  routes:
    - port: 80
      noBuffer: true
  health:
    path: /up
  release:
    - ./bin/rails
    - fog:release
  needs:
    postgres:
      databases:
        - planner_production
        - planner_production_cache
        - planner_production_queue
      extensions:
        - pg_trgm
      inject:
        DATABASE_HOST: host
        DATABASE_PASSWORD: password
        DATABASE_PORT: port
        DATABASE_USER: user
  backup:
    enabled: true
    mode: delegated
    timeout: 45m
  notes: 'A test fixture. First run: the setup wizard creates the household and its admin, or restores a fog-backup/1 artifact.'
options:
  - key: repo
    label: Git repository
    target: repo
    required: true
  - key: SECRET_KEY_BASE
    label: SECRET_KEY_BASE
    hint: Signs cookies and ActiveStorage URLs; unique per instance.
    target: secret:SECRET_KEY_BASE
    required: true
    generate: hex128
  - key: AR_ENCRYPTION_PRIMARY_KEY
    label: AR_ENCRYPTION_PRIMARY_KEY
    hint: Encrypts sensitive database columns from day one.
    target: secret:AR_ENCRYPTION_PRIMARY_KEY
    required: true
    generate: alnum32
  - key: AR_ENCRYPTION_DETERMINISTIC_KEY
    label: AR_ENCRYPTION_DETERMINISTIC_KEY
    target: secret:AR_ENCRYPTION_DETERMINISTIC_KEY
    required: true
    generate: alnum32
  - key: AR_ENCRYPTION_KEY_DERIVATION_SALT
    label: AR_ENCRYPTION_KEY_DERIVATION_SALT
    target: secret:AR_ENCRYPTION_KEY_DERIVATION_SALT
    required: true
    generate: alnum32
companions:
  - id: immich
    blurb: Photo & video library — Planner shows photos from Immich.
  - id: paperless
    blurb: Searchable document archive behind Planner's documents.
  - id: whisper
    blurb: Speech-to-text server Planner uses for voice notes.
firstParty: planner
about: |-
  Planner is a made-up first-party app for fog's tests: a Rails app with companions from the homelab catalog.
highlights:
  - Calendars, documents and todos
  - Photos from Immich and documents from Paperless
logo: tile.svg
developer: Built from your own repository
license: Private
footprint:
  memory: 734003200
  memoryPeak: 1572864000
  cpu: moderate
  cpuWhen: importing photos
  disk: 1258291200
  diskGrows: with photos and files
