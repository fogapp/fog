id: journal
title: Journal
description: A made-up first-party app for tests — a private journal on a sealed network that never leaves the house.
category: Personal cloud
icon: '📓'
spec:
  source:
    type: git
    branch: main
    dockerfile: Dockerfile
    buildArgs:
      GIT_REV: '{{commit}}'
  env:
    JOURNAL_HOST: '{{fqdn}}'
    GIT_SHA: '{{commit}}'
    JOB_CONCURRENCY: "1"
    NTFY_TOPIC: journal
    NTFY_URL: http://ntfy
    RAILS_ENV: production
    RAILS_MAX_THREADS: "8"
  secrets:
    - SECRET_KEY_BASE
    - AR_ENCRYPTION_PRIMARY_KEY
    - AR_ENCRYPTION_DETERMINISTIC_KEY
    - AR_ENCRYPTION_KEY_DERIVATION_SALT
  volumes:
    - name: storage
      mount: /rails/storage
      owner: 1000:1000
  routes:
    - port: 80
      lanOnly: true
  health:
    path: /up
  processes:
    - name: worker
      command:
        - ./bin/jobs
  release:
    - ./bin/rails
    - fog:release
  deployStrategy: swap
  needs:
    postgres:
      databases:
        - journal_production
        - journal_production_cache
        - journal_production_queue
      extensions:
        - pg_trgm
        - citext
        - pgcrypto
      inject:
        DATABASE_HOST: host
        DATABASE_NAME: dbname
        DATABASE_PASSWORD: password
        DATABASE_PORT: port
        DATABASE_USER: user
  updatePolicy: auto
  backup:
    enabled: true
    beforeUpdate: true
    mode: delegated
    timeout: 30m
  notes: 'A test fixture. Prove the seal before adding data (docs/sealed-network.md), then connect journal-collector on the Integrations tab.'
  memoryLimit: 1g
  reach:
    - ntfy
  wants:
    - offer: journal-collector/pull
  network: sealed
options:
  - key: repo
    label: Git repository
    target: repo
    required: true
  - key: SECRET_KEY_BASE
    label: SECRET_KEY_BASE
    hint: Signs cookies and ActiveStorage URLs; unique per instance.
    target: secret:SECRET_KEY_BASE
    required: true
    generate: hex128
  - key: AR_ENCRYPTION_PRIMARY_KEY
    label: AR_ENCRYPTION_PRIMARY_KEY
    hint: Encrypts sensitive database columns from day one.
    target: secret:AR_ENCRYPTION_PRIMARY_KEY
    required: true
    generate: alnum32
  - key: AR_ENCRYPTION_DETERMINISTIC_KEY
    label: AR_ENCRYPTION_DETERMINISTIC_KEY
    target: secret:AR_ENCRYPTION_DETERMINISTIC_KEY
    required: true
    generate: alnum32
  - key: AR_ENCRYPTION_KEY_DERIVATION_SALT
    label: AR_ENCRYPTION_KEY_DERIVATION_SALT
    target: secret:AR_ENCRYPTION_KEY_DERIVATION_SALT
    required: true
    generate: alnum32
companions:
  - id: journal-collector
    blurb: Fetches outside the seal — Journal pulls from it, and it can't read Journal.
    default: true
firstParty: journal
about: |-
  Journal is a made-up first-party app for fog's tests: a sealed app with a companion that shares its repository.

  It runs on a sealed network with no route out of the machine, answers on the home network only, and offers nothing to other apps.
highlights:
  - A companion outside the seal that can't read it
  - LAN-only, on the sealed network
logo: tile.svg
developer: Built from your own repository
license: Private
footprint:
  memory: 524288000
  memoryPeak: 1048576000
  cpu: light
  disk: 1258291200
  diskGrows: with entries and attachments
